<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MangaStore</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/carousel.css" />
    <link rel="stylesheet" href="css/updates.css" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ================= NAVBAR ================= -->

    <header>
      <nav class="navbar">
        <div class="logo">
          <dotlottie-player
            src="assets/navbar/evangelion.lottie"
            autoplay
            loop
            style="width: 55px; height: 55px"
          >
          </dotlottie-player>

          <span>MangaStore</span>
        </div>

        <ul class="menu">
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Lanzamientos</a></li>
          <li><a href="#">Popular</a></li>
          <li><a href="#">Navegar</a></li>
        </ul>

        <div class="search">
          <input type="text" placeholder="Buscar manga" />

          <button>
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <dotlottie-player
          src="assets/navbar/noFace2_transparente.lottie"
          autoplay
          loop
          style="width: 100px; height: 100px"
        >
        </dotlottie-player>

        <dotlottie-player
          src="assets/navbar/eso.lottie"
          autoplay
          loop
          style="width: 100px; height: 100px"
        >
        </dotlottie-player>

        <div class="icons">
          <i class="fa-regular fa-bookmark"></i>
          <i class="fa-regular fa-user"></i>
        </div>
      </nav>
    </header>

    <!-- ================= HERO ================= -->

    <section class="hero">
      <img class="hero-image" id="heroImage" />

      <div class="overlay"></div>

      <button class="arrow left">❮</button>

      <button class="arrow right">❯</button>

      <div class="card">
        <small id="subtitle"></small>

        <h1 id="title"></h1>

        <p id="description"></p>

        <button class="buy">Comprar ahora</button>
      </div>

      <div class="dots"></div>
    </section>

    <!-- ================= Galeria ================= -->
    <section class="updates-section">
        <h2 class="section-title">Ultimas actualizaciones</h2>
        <div class="manga-grid" id="mangaGrid"></div>
        <nav class="pagination" id="pagination" aria-label="Páginas"></nav>
    </section>

    <script src="js/mangas.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/updates.js"></script>
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </body>
</html>
